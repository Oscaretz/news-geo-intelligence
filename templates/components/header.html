<header class="bg-surface docked full-width top-0 sticky z-50">
<div class="flex justify-between items-center w-full px-sm md:px-margin-desktop py-xs max-w-[1440px] mx-auto border-b border-outline-variant/30">
<div class="flex items-center gap-2">
<!-- <img src="{{ url_for('static', filename='img/favicon.svg') }}" alt="AI News Explorer Logo" class="w-8 h-8 rounded-lg shadow-sm" /> -->
<span class="text-title-md font-title-md tracking-tight text-on-background font-normal">
  AI News 
  <span class="font-bold"><span style="color:#4285F4">E</span><span style="color:#EA4335">x</span><span style="color:#FBBC04">p</span><span style="color:#4285F4">l</span><span style="color:#34A853">o</span><span style="color:#EA4335">r</span><span style="color:#FBBC04">e</span><span style="color:#4285F4">r</span></span>
</span>
</div>
<div class="relative flex-1 max-w-2xl mx-lg" id="searchBarContainer">
<div id="searchBarWrapper" class="flex items-center bg-surface-container-lowest rounded-full px-4 py-2 custom-shadow border border-white/40 focus-within:ring-2 focus-within:ring-primary-container/50 focus-within:border-primary-container transition-all">
<button class="material-symbols-outlined text-on-surface-variant mr-2 select-none hover:text-primary transition-colors" data-icon="search" onclick="fetchDiscovery()" type="button">search</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-md text-on-surface placeholder:text-on-surface-variant/70 py-1 outline-none" id="mainSearchInput" placeholder="Search topics, locations, and sources..." data-i18n="searchPlaceholder" type="text" maxlength="200"/>
<button class="flex items-center justify-center p-1 hover:bg-surface-container-high rounded-full transition-colors ml-2" id="searchFilterBtn">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="arrow_drop_down">arrow_drop_down</span>
</button>
</div>
<p id="search-warning" class="hidden text-red-500 text-sm mt-2">Please enter both a keyword and the quantity of news to search.</p>
<div class="absolute top-full left-0 mt-2 w-full bg-white/90 backdrop-blur-md rounded-xl shadow-sm p-md border border-white/40 hidden" id="filterDropdown" style="z-index: 10000;">
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="secondaryKeywords">Secondary Keywords</label>
<div class="relative">
<input id="secondaryInput" class="w-full bg-surface-container rounded-md px-3 py-2 pr-8 text-body-md border-transparent focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none" placeholder="e.g. AI, Machine Learning" type="text" maxlength="200"/>
<span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant hover:text-primary cursor-pointer hidden clear-btn" style="font-size: 20px;">close</span>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="excludeWords">Exclude Words</label>
<div class="relative">
<input id="excludeInput" class="w-full bg-surface-container rounded-md px-3 py-2 pr-8 text-body-md border-transparent focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none" placeholder="e.g. crypto, nft" type="text" maxlength="200"/>
<span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant hover:text-primary cursor-pointer hidden clear-btn" style="font-size: 20px;">close</span>
</div>
</div>
<div class="col-span-2 flex gap-md items-end">
<div class="flex-1">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="dateRange">Date Range</label>
<div class="relative">
<input type="text" id="dateRange" class="w-full bg-surface-container rounded-md px-3 py-2 pr-8 text-body-md border-transparent focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none" placeholder="Select dates..." data-i18n="selectDates" readonly>
<span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant hover:text-primary cursor-pointer hidden clear-btn" style="font-size: 20px;">close</span>
</div>
</div>
<div class="flex-1">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="domainFilter">Domain filter</label>
<div class="relative">
<input type="text" id="domainInput" class="w-full bg-surface-container rounded-md px-3 py-2 pr-8 text-body-md border-transparent focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none" placeholder="e.g. .com, .gov, bbc.com" maxlength="150">
<span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant hover:text-primary cursor-pointer hidden clear-btn" style="font-size: 20px;">close</span>
</div>
</div>
<div class="flex-1">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="quantity">Quantity</label>
<div class="relative">
<input type="number" id="nqueriesInput" class="w-full bg-surface-container rounded-md px-3 py-2 pr-8 text-body-md border-transparent focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none" min="1" max="50" placeholder="10">
<span class="material-symbols-outlined absolute right-2 top-2 text-on-surface-variant hover:text-primary cursor-pointer hidden clear-btn" style="font-size: 20px;">close</span>
</div>
</div>
<div class="flex-1">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" data-i18n="country">Country</label>
<div id="countrySegmentedControl" class="flex w-full bg-surface-container rounded-md p-1 border border-transparent">
    <!-- Dynamic pill toggles will be injected here -->
</div>
</div>
</div>
<div class="col-span-2 flex justify-end gap-2 mt-2">
<button class="px-4 py-2 text-primary font-medium hover:bg-primary-container/10 rounded-full transition-colors text-body-md" id="closeFilterBtn" data-i18n="cancel">Cancel</button>
<button class="px-4 py-2 bg-primary-container text-on-primary font-medium rounded-full hover:bg-primary transition-colors text-body-md custom-shadow" id="applyFiltersBtn" onclick="fetchDiscovery()" data-i18n="applyFilters">Apply Filters</button>
</div>
</div>
</div>
</div>
<div class="flex items-center gap-2" id="actionButtons">
<button id="exportExcelBtn" class="hidden flex items-center gap-2 px-4 py-2 bg-[#f1f4fa] text-[#414754] border border-[#dfe3e8] rounded-full hover:bg-[#e5e8ee] transition-colors" onclick="exportAll()"><span class="material-symbols-outlined">output</span> <span data-i18n="export">Export</span></button>
<button id="mapearBtn" class="hidden flex items-center gap-2 px-4 py-2 bg-[#f1f4fa] text-[#414754] border border-[#dfe3e8] rounded-full hover:bg-[#e5e8ee] transition-colors" onclick="startStreamMapping()"><span class="material-symbols-outlined">map</span> <span data-i18n="extractLocations">Extract Locations</span></button>
<div class="relative">
  <button id="settingsBtn" onclick="document.getElementById('settingsDropdown').classList.toggle('hidden')" class="p-2 hover:bg-surface-container-low transition-colors duration-200 rounded-full text-on-surface-variant flex items-center justify-center" title="Settings">
    <span class="material-symbols-outlined" data-icon="settings">settings</span>
  </button>
  <div id="settingsDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-200 hidden p-3 z-50">
    <div>
      <label class="text-xs font-semibold text-on-surface-variant block mb-1.5" data-i18n="language">Language</label>
      <select id="languageSelect" onchange="changeLanguage(this.value)" class="w-full bg-surface-container border border-gray-200 rounded-lg py-1.5 px-2.5 text-sm outline-none cursor-pointer text-on-surface">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>
</div>

</div>
</div>
</header>
