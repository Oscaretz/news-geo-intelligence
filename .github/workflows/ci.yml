name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,dagster_home,logs,extra
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,venv,dagster_home,logs,extra

    - name: Run unit tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key' }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_test_key' }}
      run: |
        pytest tests/test_agents.py -v
